    skin_shadow: "#6E3F18"
    hair: "#24150F"
    hoops: "#E2B13C"
    pajamas: "#7B4BB7"
    pajamas_dark: "#5E3594"
    hearts: "#F6A8D3"
    slippers: "#F49AC1"
    lips: "#6B2B2E"
