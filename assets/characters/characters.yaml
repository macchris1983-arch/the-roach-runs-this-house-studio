# Character bible: the single source of truth for each character's look and voice.
#
# STATUS: DRAFT v0.1, built from the written description only.
# No reference image was attached when the studio was built, so these designs
# are NOT yet matched to the official reference. To lock the look:
#   1. Put the official reference art in assets/characters/reference/
#   2. Adjust the palette below to match it, then re-run `python -m studio sheet`
#   3. When the model sheet is approved, set approved: true and run
#      `python -m studio lock-characters` (records a hash that QC enforces).
approved: false
version: "0.1-draft"

wife:
  display_name: The Wife
  personality: Sharp, unbothered, runs the house; expressive face, strong opinions.
  palette:
