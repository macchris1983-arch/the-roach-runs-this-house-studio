  pan: &pan {name: pan, x: 290, y: 1172, z: 9.5}
  table: &table {name: table, x: 720, y: 1330, z: 12}
  plate_h: &plate_h {name: plate_food, x: 600, y: 1324, z: 13.5, scale: 0.9}
  plate_w: &plate_w {name: plate_food, x: 850, y: 1324, z: 13.5, scale: 0.9}
  candle: &candle {name: candle, x: 725, y: 1326, z: 13.2}
  apron: &apron {torso: apron}

