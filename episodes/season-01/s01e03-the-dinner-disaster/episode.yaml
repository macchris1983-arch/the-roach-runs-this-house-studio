# The Roach Runs This House - S01E03 "The Dinner Disaster"
# Kitchen landmarks: countertop y=1150, floor y=1580, table top y=1330 at x=720.
# The stove is a floor prop at x=330 (cooktop surface at about y=1165).
id: s01e03
slug: the-dinner-disaster
season: 1
episode: 3
title: The Dinner Disaster
logline: The Husband cooks a romantic dinner, burns it, and the Roach secretly saves it, then the Husband takes all the credit.
hook: Smoke alarm blaring, the Husband frantically fanning a burning pan with a towel.
punchline: >-
  "Secret family recipe." Behind him the Roach holds up the seasoning. The Wife slides the Husband's
  plate to the Roach; the Husband gets burnt toast.
loop: Ends on a single smoke-alarm chirp that leads straight back into the blaring alarm at the top.
outline: |-
  1. Smoke alarm, Husband fanning a burnt pan
  2. Husband: "She'll be here in two minutes!"
  3. Roach pushes a seasoning jar across the counter: "Move over, amateur."
  4. Roach seasons the pan: "A little garlic... a little love."
  5. Wife tastes: "Babe, this is AMAZING!"
  6. Husband: "Secret family recipe."
  7. Roach behind him holds up the jar
  8. Wife slides the Husband's plate to the Roach: "Family, huh?" Roach: "Merci."
  9. Husband alone with burnt toast: "...It's crunchy."
thumbnail_at: 11.4
thumbnail_text: "The roach can cook?!"
cover_at: 0.8
voice_provider: babble
music: {enabled: true, mood: sitcom_bounce, bpm: 112, root_midi: 48, seed: 303, gain: 0.2}
reels:
  title: "The Dinner Disaster | The Roach Runs This House Ep. 3"
  caption: "He burned the romantic dinner. The roach saved it. Then he said \"secret family recipe\" with his WHOLE chest 🔥🍝🪳\n\nWatch who gets his plate 😭\n\nTag someone who takes credit for everything 👇\n\nEp. 3 of The Roach Runs This House, an original animated comedy. Follow for new episodes."
  hashtags: ["#TheRoachRunsThisHouse", "#animation", "#cartoon", "#comedy", "#couplescomedy", "#reels"]

common:
