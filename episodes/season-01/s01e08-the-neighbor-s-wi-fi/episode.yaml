outline: |-
  1. Husband guessing passwords out loud: "password123... Kevin..."
  2. Wife: "You're stealing Kevin's Wi-Fi now?"
  3. Vent rattles; Roach drops out with a sticky note
  4. Roach: "It's KevinsMom1972."
  5. Husband: "How do YOU know that?" Roach: "I live over there too."
  6. Wife: "You have a SIDE house?!"
  7. Roach: "Two families. I'm a busy man." (climbs back in the vent)
