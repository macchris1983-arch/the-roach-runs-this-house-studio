id: s01e10
slug: couples-game-night
season: 1
episode: 10
title: Couples Game Night
logline: It's couples trivia night. The Husband doesn't know a single answer about his wife, but the Roach knows everything.
hook: A game-show title card - COUPLES GAME NIGHT! - and the couple holding scorecards.
punchline: >-
  The Wife switches partners to the Roach. "How do YOU know her mom's birthday?!" "I've been to every
  cookout." The Husband ends up partnered with the cereal bowl.
loop: Ends on the Husband and his new partner, the cereal bowl from Episode 1.
outline: |-
  1. Game-show title card; couch, scorecards
  2. Q1: "What's my favorite color?" Husband: "...Green?" (buzzer)
  3. Roach from the lamp: "Purple. Obviously."
  4. Q2: her mom's birthday; Husband panics
  5. Roach: "March third." (ding)
  6. Wife switches to the Roach
  7. Husband: "How do YOU know her mom's birthday?!"
  8. Roach: "I've been to every cookout." Husband gets paired with the cereal bowl
