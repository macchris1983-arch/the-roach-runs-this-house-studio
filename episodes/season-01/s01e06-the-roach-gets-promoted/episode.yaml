# The Roach Runs This House - S01E06 "The Roach Gets Promoted"
# Kitchen landmarks: countertop y=1150, floor y=1580, table top y=1330 at x=720.
id: s01e06
slug: the-roach-gets-promoted
season: 1
episode: 6
title: The Roach Gets Promoted
logline: The Wife makes the Roach Head of Pest Control to keep other bugs out, and he takes the job very seriously.
hook: The Wife pins a tiny name tag on the Roach - HEAD OF PEST CONTROL.
punchline: >-
  The Roach writes the Husband up for every mess in the house and pays his rent with the fines.
  "You're paying rent with MY fines?!" "Code nine. Yelling."
loop: Ends on a whistle blast, the same sound that starts his first ticket.
outline: |-
  1. Wife pins the name tag on the Roach
  2. Roach salutes, gets a clipboard
  3. Husband leaves a dirty plate; whistle; "Code twelve. Crumbs."
  4. Montage of tickets: chips left open, sock on the floor
  5. Husband: "How much do I OWE?!"
  6. Roach hands the Wife an envelope: "Your rent, ma'am."
  7. Husband: "You're paying rent with MY fines?!"
  8. Roach: "Code nine. Yelling." *whistle*
thumbnail_at: 3.6
thumbnail_text: "Head of pest control"
cover_at: 3.0
voice_provider: babble
music: {enabled: true, mood: sitcom_bounce, bpm: 116, root_midi: 47, seed: 606, gain: 0.2}
reels:
  title: "The Roach Gets Promoted | The Roach Runs This House Ep. 6"
  caption: "She gave the roach ONE job. Now he's writing tickets 🪳📋\n\nWait for what he does with the fines 😭\n\nTag the person who'd get the most tickets in your house 👇\n\nEp. 6 of The Roach Runs This House, an original animated comedy. Follow for new episodes."
  hashtags: ["#TheRoachRunsThisHouse", "#animation", "#cartoon", "#comedy", "#couplescomedy", "#reels"]

