# The Roach Runs This House - S01E07 "Don't Touch My Food"
# Kitchen landmarks: countertop y=1150, floor y=1580, table top y=1330 at x=720.
id: s01e07
slug: don-t-touch-my-food
season: 1
episode: 7
title: Don't Touch My Food
logline: The Wife labels her takeout DON'T TOUCH. The Husband eats it anyway and blames the Roach, who has receipts.
hook: The Wife slaps a DON'T TOUCH label on her takeout and points at it.
punchline: >-
  The Roach plays security-camera footage of the Husband licking the box. The Wife sticks the
  DON'T TOUCH label on the Husband's forehead, and the Roach gets the last dumpling.
loop: Ends on the Roach's "Still warm" close-up at the table where the takeout started.
outline: |-
  1. Wife labels takeout DON'T TOUCH and leaves
  2. Husband looks left, right, eats it all
  3. Wife returns: "Where's my food?"
  4. Husband points at the Roach: "HIM."
  5. Roach: "Roll the tape." Security footage shows the Husband licking the box
  6. Wife sticks the label on the Husband's forehead
  7. Roach gets the leftover dumpling
thumbnail_at: 0.9
thumbnail_text: "Who ate my food?!"
cover_at: 0.9
voice_provider: babble
music: {enabled: true, mood: sneaky_funk, bpm: 106, root_midi: 46, seed: 707, gain: 0.2}
reels:
  title: "Don't Touch My Food | The Roach Runs This House Ep. 7"
  caption: "She labeled it DON'T TOUCH. He touched it. The roach had the footage 📹🥡🪳\n\nWait for where the label ends up 😭\n\nTag the food thief in your house 👇\n\nEp. 7 of The Roach Runs This House, an original animated comedy. Follow for new episodes."
  hashtags: ["#TheRoachRunsThisHouse", "#animation", "#cartoon", "#comedy", "#couplescomedy", "#reels"]

