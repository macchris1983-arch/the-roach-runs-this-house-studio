    sfx:
      - {at: 0.6, name: dun_dun_dun, gain: 0.55}
    lines:
      - {id: L03, who: roach, at: 2.0, text: "Looking for this?"}

  - id: D
    dur: 3.8
    background: living_room
    camera: {x: 470, y: 600, zoom: 2.6}
    props: [*router]
    actors:
      roach: {<<: *roach_sit, expr: smug, look: camera, hold: {R: sticky_note}, action: hold_up,
