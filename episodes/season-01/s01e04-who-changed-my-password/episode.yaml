      - {at: 1.0, name: ding, gain: 0.55}
    lines:
      - {id: L08, who: husband, at: 1.3, text: "WHY does SHE get it for free?!"}

  - id: I
    dur: 2.8
    background: living_room
    camera: {x: 470, y: 600, zoom: 2.7}
    props: [*router]
    actors:
