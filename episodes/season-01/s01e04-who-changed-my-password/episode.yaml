  - id: G
    dur: 3.0
    background: living_room
    camera: {x: 320, y: 1150, zoom: 1.35}
    actors:
      husband: {x: 300, y: 1880, scale: 0.95, z: 20, action: scream, expr: screaming, look: up, hold: {R: phone_big}}
    fx:
      - {type: shake, at: 0.2, dur: 1.8, amp: 18}
