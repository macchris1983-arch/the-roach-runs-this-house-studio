# The Roach Runs This House - S01E04 "Who Changed My Password?"
# Living room landmarks: TV stand top y=700 (x 110-560), couch x 60-1020, floor y=1560.
# The router sits on the TV stand at x=470.
id: s01e04
slug: who-changed-my-password
season: 1
episode: 4
title: Who Changed My Password?
logline: The Wi-Fi password changed overnight and the couple blame each other, until they find the Roach sitting on the router.
hook: The Husband glaring at a spinning loading icon, NO INTERNET.
punchline: >-
  The Roach makes the Husband yell "THE ROACH RUNS THIS HOUSE!" for the password, then tosses it to the
  Wife for free. "Why does SHE get it free?!" "She pays." (callback to S01E01)
loop: Ends on the Roach's smug close-up on the router, which the opening phone-rage cuts straight back into.
outline: |-
  1. Husband: "Who changed the Wi-Fi password?!"
  2. Wife: "Don't look at me. I need it for my shows."
  3. Both look up: Roach lounging on the blinking router: "Looking for this?"
  4. Roach: "New password. You gotta say it... out loud."
  5. Husband (mumbling): "...the roach runs this house."
  6. Roach: "Louder."
  7. Husband: "THE ROACH RUNS THIS HOUSE!"
  8. Roach tosses the sticky note to the Wife. Husband: "WHY does SHE get it for free?!"
  9. Roach: "She pays."
thumbnail_at: 9.2
thumbnail_text: "Who changed the Wi-Fi?!"
cover_at: 0.9
voice_provider: babble
music: {enabled: true, mood: sneaky_funk, bpm: 98, root_midi: 41, seed: 404, gain: 0.2}
reels:
  title: "Who Changed My Password? | The Roach Runs This House Ep. 4"
  caption: "The Wi-Fi password changed overnight... and the new one is DISRESPECTFUL 📶🪳\n\nHe had to say it out loud 😭 Watch till the end for who gets it for free.\n\nWhat would you do for the Wi-Fi password? 👇\n\nEp. 4 of The Roach Runs This House, an original animated comedy. Follow for new episodes."
  hashtags: ["#TheRoachRunsThisHouse", "#animation", "#cartoon", "#comedy", "#couplescomedy", "#wifi", "#reels"]

common:
  router: &router {name: router, x: 470, y: 702, z: 6}
  roach_on_router: &roach_sit {x: 470, y: 652, scale: 0.75, z: 7, action: sit}

shots:
  # ---------------------------------------------------------------- HOOK
  - id: A
    dur: 3.0
    background: living_room
    camera: {x: 500, y: 1180, zoom: 1.5}
    props: [*router]
    actors:
      husband: {x: 380, y: 1880, scale: 0.95, z: 20, action: present, expr: furious, look: right, hold: {R: phone_big}}
    fx:
      - {type: burst, at: 0.05, dur: 1.4, pos: [560, 330], world: false, text: "NO INTERNET", size: 74, bg: "#E86A5B"}
    sfx:
      - {at: 0.05, name: buzzer, gain: 0.7}
    lines:
      - {id: L01, who: husband, at: 0.45, text: "Who changed the Wi-Fi password?!"}

  - id: B
    dur: 3.1
    background: living_room
    camera: {x: 780, y: 1180, zoom: 1.5}
    props: [*router]
    actors:
      wife: {x: 780, y: 1880, scale: 1.0, z: 20, action: cross_arms, expr: unbothered, look: left}
    lines:
      - {id: L02, who: wife, at: 0.25, text: "Don't look at me. I need it for my shows."}

  # ---------------------------------------------------------------- the reveal
  - id: C
    dur: 3.6
    background: living_room
    camera: {x: 540, y: 1100, zoom: 1.0, keys: [{at: 1.8, x: 470, y: 660, zoom: 1.8, from: 0.6, ease: inout}]}
    props: [*router]
    actors:
      husband: {x: 300, y: 1880, scale: 0.95, z: 20, action: idle, expr: angry, look: right, hold: {R: phone_big},
                keys: [{at: 0.5, look: up, expr: shocked}]}
      wife: {x: 800, y: 1880, scale: 1.0, z: 21, action: cross_arms, expr: sideeye, look: left,
             keys: [{at: 0.5, look: up, expr: shocked}]}
      roach: {<<: *roach_sit, expr: smug, look: camera, hold: {R: sticky_note},
