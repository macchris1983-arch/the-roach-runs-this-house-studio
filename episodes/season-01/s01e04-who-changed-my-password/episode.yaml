    sfx:
      - {at: 0.15, name: scream_sting, gain: 0.6}
    lines:
      - {id: L07, who: husband, at: 0.2, text: "THE ROACH RUNS THIS HOUSE!"}

  # ---------------------------------------------------------------- PUNCHLINE
