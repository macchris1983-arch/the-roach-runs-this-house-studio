    lines:
      - {id: L07, who: wife, at: 0.3, text: "HE has a lawyer..."}
      - {id: L08, who: wife, at: 1.8, text: "...and YOU don't have a job?"}

  # ---------------------------------------------------------------- LOOP ENDING
  - id: H
    dur: 3.7
    background: kitchen
    camera: {x: 600, y: 1200, zoom: 1.0}
    props: [*table, *box]
    actors:
      husband: {x: 470, y: 1840, scale: 0.95, z: 20, action: wind_up, expr: nervous, hold: {R: cup}, look: right,
                keys: [{at: 2.6, expr: determined}]}
      roach: {x: 770, y: 1326, scale: 1.0, z: 13, action: walk, expr: smug, look: camera,
              keys: [{at: 1.2, x: 880, ease: out}, {at: 1.2, action: hips}]}
      roach@lawyer: {x: 600, y: 1326, scale: 0.85, z: 15, action: hips, expr: smug, variants: *lawyer, hold: {L: briefcase}}
      roach@b1: {x: 760, y: 1870, scale: 0.38, z: 25, action: dance, expr: happy}
      roach@b2: {x: 860, y: 1862, scale: 0.38, z: 25, action: dance, expr: happy, phase: 1}
      roach@b3: {x: 960, y: 1876, scale: 0.38, z: 25, action: dance, expr: happy}
      roach@b4: {x: 1060, y: 1866, scale: 0.38, z: 25, action: dance, expr: happy}
    sfx:
