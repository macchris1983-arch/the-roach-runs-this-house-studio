title: The $20 Shopping Trip
logline: The Wife sends the Husband to the store with $20 and a list. The Roach rides along in the grocery bag.
hook: The Wife slaps a $20 bill into the Husband's hand - "ONLY what's on the list."
punchline: >-
  The Husband comes back with chips, soda and a scratch-off. The Roach climbs out of the bag with the
  milk, the eggs, the receipt and $3.12 change. The scratch-off loses.
loop: Ends on the Wife and Roach's fist bump, the same table where the $20 changed hands.
outline: |-
  1. Wife gives $20 + list: "ONLY what's on the list"
  2. Husband: "I got this." The Roach hops into the grocery bag
  3. 20 MINUTES LATER
  4. Husband returns: chips, soda, a scratch-off
  5. Wife: "Where's the milk? The eggs?"
  6. Roach climbs out with milk, eggs, receipt and change: "I used coupons."
  7. Husband scratches the ticket confidently: loses
  8. Roach and Wife fist-bump
