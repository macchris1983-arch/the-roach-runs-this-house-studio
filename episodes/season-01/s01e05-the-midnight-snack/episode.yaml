id: s01e05
slug: the-midnight-snack
season: 1
episode: 5
title: The Midnight Snack
logline: At 3 a.m. the Husband sneaks to the fridge for the Wife's cake, but the Roach is already in there with a fork.
hook: The fridge door swings open in the dark kitchen and the Roach is inside, mid-bite.
punchline: >-
  They swear a pact of silence. The Wife flips on the light and the Roach instantly points at the
  Husband: "He told me to hold it."
loop: Ends with the light clicking off on the empty kitchen, back to the dark opening.
outline: |-
  1. Darkness; Husband tiptoes in
  2. Opens fridge: Roach inside with a fork in the cake
  3. Whispered argument
  4. They agree to split it: "Pact."
  5. Lights snap on: Wife in the doorway
  6. Roach points at Husband: "He told me to hold it."
  7. Husband: "WE HAD A PACT!"
  8. Wife takes the cake; Roach follows her out
thumbnail_at: 5.4
thumbnail_text: "3 AM cake heist"
cover_at: 5.0
voice_provider: babble
music: {enabled: true, mood: suspense, bpm: 92, root_midi: 44, seed: 505, gain: 0.18}
reels:
  title: "The Midnight Snack | The Roach Runs This House Ep. 5"
  caption: "3 AM. Fridge light on. The roach was ALREADY in the cake 🍰🪳\n\nThey made a pact... watch how long it lasts 😭\n\nTag the person who'd snitch on you first 👇\n\nEp. 5 of The Roach Runs This House, an original animated comedy. Follow for new episodes."
  hashtags: ["#TheRoachRunsThisHouse", "#animation", "#cartoon", "#comedy", "#couplescomedy", "#reels"]

