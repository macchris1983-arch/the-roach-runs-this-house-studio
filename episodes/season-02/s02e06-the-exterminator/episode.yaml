  roach_couch: &roach_couch {x: 760, y: 1095, scale: 0.7, z: 9}
  husband_spot: &husband_spot {x: 280, y: 1880, scale: 0.95, z: 20}

shots:
  # ---------------------------------------------------------------- HOOK
  - id: A
    dur: 2.8
    background: living_room
    camera: {x: 320, y: 1250, zoom: 1.6}
    actors:
      husband: {<<: *husband_spot, action: phone, expr: furious, look: camera, hold: {R: phone_big}}
    fx:
      - {type: burst, at: 0.05, dur: 1.4, pos: [540, 330], world: false, text: "CALL A PRO", size: 70, bg: "#6FB7E8"}
    sfx:
      - {at: 0.0, name: phone_dial, gain: 0.6}
    lines:
      - {id: L01, who: husband, at: 0.6, shout: true, text: "I need a PROFESSIONAL. Today."}

  - id: B
    dur: 2.2
    background: living_room
    camera: {x: 420, y: 1300, zoom: 1.2}
    actors:
      husband: {<<: *husband_spot, action: idle, expr: confused, look: right, hold: {R: phone_big}}
    sfx:
      - {at: 0.0, name: ding, gain: 0.7}
    lines:
      - {id: L02, who: husband, at: 0.5, text: "Wow. That was fast."}

  - id: C
    dur: 3.4
