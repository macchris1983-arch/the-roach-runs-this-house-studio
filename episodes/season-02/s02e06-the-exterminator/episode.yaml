# The Roach Runs This House - S02E06 "The Exterminator"  (Roach Wars, part 6)
# Living room landmarks: couch x 60-1020, couch-back top y=1080, floor y=1560.
# The Roach works from the top of the couch back.
id: s02e06
slug: the-exterminator
season: 2
episode: 6
title: The Exterminator
logline: Roach Wars, round five. The Husband gives up and calls a professional exterminator, and the professional who shows up is the Roach.
hook: 'CALL A PRO. The Husband on the phone: "I need a PROFESSIONAL. Today."'
punchline: >-
  The Roach "inspects" the house and finds the pest: "Six foot. Beard. Very loud." The Wife agrees, and the Roach
  bills the Husband two hundred dollars for emotional damage.
loop: Ends with the Husband calling for a second opinion, and the Roach's phone ringing. "Pest Control."
outline: |-
  1. CALL A PRO. Husband: "I need a PROFESSIONAL. Today."
  2. Ding. Husband: "Wow. That was fast."
  3. The Roach in a badge and glasses with a clipboard: "Pest Control. You called?"
  4. Husband: "YOU'RE the exterminator?!"
  5. Roach inspects: "Mm-hm. Mm-hm. I found the problem."  Husband: "Where?!"
  6. Roach points at him: "Six foot. Beard. Very loud."
  7. Wife: "Yep. That's the pest."
  8. Roach hands over a bill: "Two hundred dollars."  Husband: "For WHAT?!"  Roach: "Emotional damage."
  9. Husband dials again: "I need a SECOND opinion." The Roach's phone rings: "Pest Control."
thumbnail_at: 6.6
thumbnail_text: "The exterminator is a roach"
cover_at: 6.6
voice_provider: babble
music: {enabled: true, mood: sneaky_funk, bpm: 100, root_midi: 45, seed: 2606, gain: 0.2}
reels:
  title: "The Exterminator | The Roach Runs This House S2 Ep. 6"
  caption: "He finally called a professional exterminator... guess who showed up 📋🪳\n\nWait for who the roach says the REAL pest is 😭\n\nTag the person who'd get billed for emotional damage 👇\n\nROACH WARS, Season 2, Ep. 6 of The Roach Runs This House, an original animated comedy. Next week: the main event."
  hashtags: ["#TheRoachRunsThisHouse", "#animation", "#cartoon", "#comedy", "#couplescomedy", "#reels"]

common:
