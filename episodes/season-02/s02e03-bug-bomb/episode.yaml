  - id: A
    dur: 2.8
    background: kitchen
    camera: {x: 520, y: 1250, zoom: 1.0, keys: [{at: 2.6, x: 360, zoom: 1.35, from: 0.4}]}
    props: [*table]
    actors:
      husband: {<<: *husband_spot, action: hold_up, expr: determined, look: camera, hold: {R: spray_can}}
      roach: {<<: *roach_table, action: eat, expr: chewing, look: left, hold: {R: toast}}
    fx:
      - {type: burst, at: 0.05, dur: 1.5, pos: [540, 330], world: false, text: "BUG BOMB!", size: 72, bg: "#7BC96F"}
      - {type: flash, at: 0.0, dur: 0.15}
    sfx:
      - {at: 0.0, name: dun_dun_dun, gain: 0.55}
    lines:
      - {id: L01, who: husband, at: 1.2, pitch: 0.88, speed: 0.85, text: "Military grade."}

  - id: B
    dur: 2.8
    background: kitchen
    camera: {x: 520, y: 1250, zoom: 1.0}
    props: [*table]
    actors:
      husband: {<<: *husband_spot, action: point_R, expr: furious, look: right, hold: {R: spray_can}}
      roach: {<<: *roach_table, action: freeze, expr: unbothered, look: left, hold: {R: toast}}
    fx:
