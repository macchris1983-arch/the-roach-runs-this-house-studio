    lines:
      - {id: L02, who: husband, at: 0.3, shout: true, text: "Nothing survives this!"}

  - id: C
    dur: 2.4
    background: kitchen
    camera: {x: 300, y: 1250, zoom: 1.6}
    props: [*table]
    actors:
      husband: {<<: *husband_spot, action: tremble, expr: pleading, look: camera, hold: {R: spray_can}}
    fx:
