# The Roach Runs This House - S02E03 "Bug Bomb"  (Roach Wars, part 3)
# Kitchen landmarks: countertop y=1150 (x 0-820), fridge x 820-1090, floor y=1580, table top y=1330 at x=720.
id: s02e03
slug: bug-bomb
season: 2
episode: 3
title: Bug Bomb
logline: Roach Wars, round two. The Husband fogs the kitchen with military-grade bug spray; the Roach comes out of the fog in a towel, thanking him for the sauna.
hook: "BUG BOMB! The Husband holds up a giant spray can: \"Military grade.\""
punchline: >-
  The fog clears and the Roach is relaxing on the table in a towel: "Ahh. Thanks for the sauna." The can says
  lavender scent, and the Wife loves how the kitchen smells.
loop: Ends with the Husband spraying himself in the face and the Roach repeating "Military grade."
outline: |-
  1. BUG BOMB! Husband: "Military grade."
  2. He sprays the whole kitchen: "Nothing survives this!"
  3. Total fog. "*cough* ...nothing."
  4. Fog clears: the Roach in a towel. "Ahh. Thanks for the sauna."
  5. Husband: "That was MILITARY GRADE!"
  6. Roach reads the can: "Says here... lavender scent."
  7. Wife walks in: "Why does my kitchen smell like a spa?"
  8. Wife: "...Honestly? It's nice."  Roach: "I added eucalyptus."
  9. Husband sprays again, backwards, into his own face. Roach: "Military grade."
thumbnail_at: 1.1
thumbnail_text: "Bug spray vs roach"
cover_at: 1.1
voice_provider: babble
music: {enabled: true, mood: sneaky_funk, bpm: 102, root_midi: 44, seed: 2303, gain: 0.2}
reels:
  title: "Bug Bomb | The Roach Runs This House S2 Ep. 3"
  caption: "He bug-bombed the whole kitchen... and the roach came out RELAXED 🧴🪳\n\nWait for what the can actually says 😭\n\nWho in your house thinks bug spray works? 👇\n\nROACH WARS, Season 2, Ep. 3 of The Roach Runs This House, an original animated comedy. Follow for the next round."
  hashtags: ["#TheRoachRunsThisHouse", "#animation", "#cartoon", "#comedy", "#couplescomedy", "#reels"]

common:
  table: &table {name: table, x: 720, y: 1330, z: 12}
  roach_table: &roach_table {x: 700, y: 1326, scale: 1.0, z: 13}
  husband_spot: &husband_spot {x: 280, y: 1880, scale: 0.95, z: 20}
  fog_in: &fog_in {type: flash, color: "#D9D4C8", at: 0.0, dur: 6.0}

shots:
