# The Roach Runs This House - S02E02 "The Slipper"  (Roach Wars, part 2)
# Living room landmarks: couch x 60-1020, couch-back top y=1080, seat cushions y=1290, floor y=1560.
id: s02e02
slug: the-slipper
season: 2
episode: 2
title: The Slipper
logline: Roach Wars, round one. The Husband goes old school with a slipper; the Roach dodges like it's slow motion, catches the Wife's slipper and sends it back.
hook: Slow motion. The Husband winds up a slipper. "Say goodnight."
punchline: >-
  The Roach catches the Wife's slipper, says "Thank you," and throws it back. Direct hit. The Husband goes down,
  and the Wife reminds him what happens if he misses: he's on the couch. The Roach: "I'll make room."
loop: Ends on the Roach winding up the slipper with the same "Say goodnight." the Husband opened with.
outline: |-
  1. Slow-mo wind-up. Husband: "Say goodnight, you nasty little raisin."
  2. Throw. The Roach hops over it. MISS. Roach: "You throw like your momma throws parties. Nobody shows up."
  3. Husband: "Babe. I need your slipper." Wife: "Absolutely not."
  4. Husband: "Your momma so nasty she got roaches... and she IS a roach!"  Roach: "Dawg. Your hairline been running from you since 2009."
  5. Wife hands it over: "Miss, and you sleep on the couch."
  6. Second throw. The Roach catches it. "Thank you. Your wife got better aim than your whole bloodline."
  7. Roach throws it back. BONK. Husband goes down.
  8. Wife: "Couch." Roach: "I'll make room. Bring your own blanket, mine don't smell like feet."
  9. Roach winds up: "Say goodnight, you nasty BIG raisin."
thumbnail_at: 1.0
thumbnail_text: "Slipper vs roach"
cover_at: 1.0
voice_provider: babble
music: {enabled: true, mood: suspense, bpm: 100, root_midi: 45, seed: 2202, gain: 0.18}
reels:
  title: "The Slipper | The Roach Runs This House S2 Ep. 2"
  caption: "Every household's #1 roach weapon... the SLIPPER 🩴🪳\n\nHe really thought this would work 😭 Watch the second throw.\n\nWho in your house throws the slipper? 👇\n\nROACH WARS, Season 2, Ep. 2 of The Roach Runs This House, an original animated comedy. Follow for the next round."
  hashtags: ["#TheRoachRunsThisHouse", "#animation", "#cartoon", "#comedy", "#couplescomedy", "#reels"]

