# The Roach Runs This House - S02E04 "The Sticky Trap"  (Roach Wars, part 4)
# Kitchen landmarks: countertop y=1150 (x 0-820), fridge x 820-1090, floor y=1580.
# The trap sits on the floor at (600, 1720). The Roach family: Grandma (glasses), Cousin, and two kids.
id: s02e04
slug: the-sticky-trap
season: 2
episode: 4
title: The Sticky Trap
logline: Roach Wars, round three. The Husband baits a sticky trap with a dumpling; the Roach calls the whole family over for a buffet, and the only one who gets stuck is the Husband.
hook: The Husband sets a STICKY TRAP with a dumpling on it. "He can't resist."
punchline: >-
  The family eats the bait without touching the sticky part and leaves a five-star review. The Husband stomps
  over in a rage, and he's the one stuck to the floor. "It's a STRATEGY."
loop: Ends with Grandma Roach waving from the counter, "Same time tomorrow, baby!", setting up the next trap.
outline: |-
  1. Husband sets the trap with a dumpling: "Five-star bait. He can't resist."
  2. Night. The Roach sniffs it: "A free buffet? ...Bring the family."
  3. THE FAMILY marches in: Grandma, Cousin, two kids. Grandma: "Ooh, dumplings!"
  4. Roach: "Don't touch the yellow part." Kids: "Okaaay!"
  5. Morning. Husband: "GOT HIM!" The trap holds one sticky note.
  6. Note: "5 stars. Great service."
  7. Husband stomps over: STUCK. "...Oh no."
  8. Wife: "Why are you stuck to the floor?" Husband: "It's a STRATEGY."
  9. Grandma from the counter: "Same time tomorrow, baby!"
thumbnail_at: 9.0
thumbnail_text: "He brought the whole family"
cover_at: 9.0
voice_provider: babble
music: {enabled: true, mood: sneaky_funk, bpm: 104, root_midi: 42, seed: 2404, gain: 0.2}
reels:
  title: "The Sticky Trap | The Roach Runs This House S2 Ep. 4"
  caption: "He set a roach trap... and the roach brought the WHOLE FAMILY 🪤🪳🪳🪳\n\nWait for the review they left 😭\n\nTag the person who always gets stuck in their own plan 👇\n\nROACH WARS, Season 2, Ep. 4 of The Roach Runs This House, an original animated comedy. Follow for the next round."
  hashtags: ["#TheRoachRunsThisHouse", "#animation", "#cartoon", "#comedy", "#couplescomedy", "#reels"]

