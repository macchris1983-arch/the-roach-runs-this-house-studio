# The Roach Runs This House - S02E07 "The Main Event"  (Roach Wars, season finale)
# Living room landmarks: couch x 60-1020, couch-back top y=1080, floor y=1560.
# The Roach talks from the top of the couch back, his family watching from the other end of it.
id: s02e07
slug: the-main-event
season: 2
episode: 7
title: The Main Event
logline: "Roach Wars finale. The Roach won't stop roasting the Husband, the Husband finally snaps and swings, and the Roach dodges and knocks him out."
hook: "The Roach on the couch, mid-roast: \"Your forehead so big I can see the TV in it.\""
punchline: >-
  The Roach goes after the Husband's momma one time too many. The Husband snaps and throws a haymaker; the Roach
  dodges, the punch hits the couch, and the Roach comes back with one shot to the chin. TIMBER. The Wife walks in:
  "What happened?" Roach: "He tried it."
loop: Ends with the Husband face-down demanding a rematch next season, and the Roach on his back saying "Pay rent first."
outline: |-
  1. Roach: "Bro, your forehead so big I can see the TV in it."
  2. Husband: "Keep talking, roach. Keep talking."
  3. Roach: "Your momma so broke, she pay ME rent."
  4. Husband: "Leave my momma OUT of this!"
  5. Roach: "Your momma's breath smells like she eats yo daddy's ass at night, just to talk shit in the morning." OHHHH!
  6. Husband: "THAT'S IT!"
  7. Haymaker. The Roach dodges. The punch hits the couch. MISS.
  8. Roach: "Float like a roach... sting like a roach." POW. TIMBER.
  9. Wife walks in: "What happened?" Roach, on his back: "He tried it."
  10. Husband, face-down: "Rematch. Season three."  Roach: "Pay rent first."
thumbnail_at: 22.0
thumbnail_text: "He fought the roach"
cover_at: 22.0
voice_provider: babble
music: {enabled: true, mood: suspense, bpm: 120, root_midi: 43, seed: 2707, gain: 0.2}
reels:
  title: "The Main Event | The Roach Runs This House S2 Finale"
  caption: "The roach would NOT stop talking about his momma... so he swung 👊🪳\n\nWait for the dodge 😭\n\nWho's winning this fight in your house? 👇\n\nROACH WARS finale, Season 2, Ep. 7 of The Roach Runs This House, an original animated comedy. Follow for Season 3."
  hashtags: ["#TheRoachRunsThisHouse", "#animation", "#cartoon", "#comedy", "#roast", "#reels"]

