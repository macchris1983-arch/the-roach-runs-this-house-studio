# The Roach Runs This House - S02E05 "Grandma's Secret Powder"  (Roach Wars, part 5)
# Kitchen landmarks: countertop y=1150 (x 0-820), fridge x 820-1090, floor y=1580, table top y=1330 at x=720.
# The Roach family cookout happens on the table.
id: s02e05
slug: grandma-s-secret-powder
season: 2
episode: 5
title: Grandma's Secret Powder
logline: Roach Wars, round four. The Husband breaks out his grandma's secret anti-roach powder; the Roach family uses it to season their cookout.
hook: SECRET WEAPON. The Husband holds up his grandma's powder. "Roaches HATE this."
punchline: >-
  The family is having a full cookout on the table, seasoned with the powder. "Baby, that's FLAVOR." The Wife
  tastes it and asks who seasoned it. Grandma Roach: "His grandma." The Wife: "You never cook like this."
loop: Ends with the Husband pulling out Grandma's OTHER powder, and the family holding up their plates for more.
outline: |-
  1. SECRET WEAPON. Husband: "My grandma's powder. Roaches HATE this."
  2. He shakes it everywhere: "Goodbye, roaches."
  3. The Roach family cookout on the table. Roach: "Pass the seasoning."
  4. Husband: "That's POISON!"
  5. Grandma Roach: "Baby, that's FLAVOR."  Kids: "More!"
  6. Wife tastes it: "Mm! Who seasoned this?"  Grandma Roach: "His grandma."
  7. Wife: "...You never cook like this."
  8. Grandma Roach: "Tell her it needs garlic."
  9. Husband: "Grandma's OTHER powder." The family: "Ooh!"
thumbnail_at: 7.0
thumbnail_text: "Roach cookout"
cover_at: 7.0
voice_provider: babble
music: {enabled: true, mood: sitcom_bounce, bpm: 110, root_midi: 47, seed: 2505, gain: 0.2}
reels:
  title: "Grandma's Secret Powder | The Roach Runs This House S2 Ep. 5"
  caption: "He used his grandma's secret anti-roach powder... and the roaches started a COOKOUT 🧂🪳🍗\n\nWait for what Grandma Roach says about it 😭\n\nWhat's your family's old-school roach remedy? 👇\n\nROACH WARS, Season 2, Ep. 5 of The Roach Runs This House, an original animated comedy. Follow for the next round."
  hashtags: ["#TheRoachRunsThisHouse", "#animation", "#cartoon", "#comedy", "#couplescomedy", "#reels"]

