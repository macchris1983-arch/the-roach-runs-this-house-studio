#   fx:          flash darkness vignette speedlines text burst sweat marks dust shake
#   sfx:         run `python -m studio sfx` and look in assets/audio/sfx/
#   Kitchen landmarks: countertop y=1150, floor y=1580, table top y=1330 at x=720
